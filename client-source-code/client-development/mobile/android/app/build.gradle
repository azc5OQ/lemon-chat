plugins
{
    alias(libs.plugins.android.application)
}


// the fetcher owns the runtime version and supported architectures
def pythonExe = resolvePython()
def nodeRuntimeFetcher = rootProject.file('../nodejs-client/fetch-nodejs-mobile.py')
def runtimeMetadataProcess = [pythonExe, nodeRuntimeFetcher.absolutePath, '--metadata'].execute()
def runtimeMetadataText = runtimeMetadataProcess.inputStream.getText('UTF-8')
def runtimeMetadataError = runtimeMetadataProcess.errorStream.getText('UTF-8')
runtimeMetadataProcess.waitFor()
if (runtimeMetadataProcess.exitValue() != 0)
{
    throw new GradleException('Cannot read Node runtime metadata: ' + runtimeMetadataError)
}
def nodeRuntimeMetadata = new groovy.json.JsonSlurper().parseText(runtimeMetadataText)
def minimumAndroidApi = 26
if (nodeRuntimeMetadata.android_min_api > minimumAndroidApi || nodeRuntimeMetadata.header_cpp_standard != 20)
{
    throw new GradleException('The pinned Node runtime needs an explicit Android API or C++ standard update')
}
def androidAbis = providers.gradleProperty('androidAbis').orElse(nodeRuntimeMetadata.default_abis.join(',')).get().split(',').collect
{
    it.trim()
}.unique().sort()
def unsupportedAbis = androidAbis.findAll
{
    !(it in nodeRuntimeMetadata.supported_abis)
}
if (androidAbis.isEmpty() || !unsupportedAbis.isEmpty())
{
    throw new GradleException('androidAbis must select from ' + nodeRuntimeMetadata.supported_abis.join(', '))
}
def nodeRuntimeDirectory = layout.buildDirectory.dir('generated/node-runtime/' + nodeRuntimeMetadata.version + '/' + androidAbis.join('_')).get().asFile
def verificationBuild = providers.gradleProperty('verificationBuild').orElse('false').get().toBoolean()
def hybridApplicationId = verificationBuild ? 'com.lemonchat.hybridverification' : 'com.lemonchat'

android
{
    namespace 'com.lemonchat'
    compileSdk 36

    defaultConfig
    {
        applicationId hybridApplicationId
        manifestPlaceholders = [hybridTargetPackage: hybridApplicationId, hybridAppLabel: verificationBuild ? 'Lemon Hybrid Verification' : '@string/app_name']
        minSdk minimumAndroidApi
        //noinspection ExpiredTargetSdkVersion
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk
        {
            abiFilters.addAll(androidAbis)
        }

        externalNativeBuild
        {
            cmake
            {
                // node and the JNI adapter use the same packaged C++ runtime
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', '-DNODEJS_MOBILE_ROOT=' + nodeRuntimeDirectory.absolutePath.replace('\\', '/')
            }
        }
    }

    // builds liblemonchatnode.so, the jni glue that calls node::Start
    externalNativeBuild
    {
        cmake
        {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    ndkVersion nodeRuntimeMetadata.source_ndk_revision

    sourceSets
    {
        main.jniLibs.setSrcDirs([new File(nodeRuntimeDirectory, 'jniLibs')])
    }

    packaging
    {
        jniLibs
        {
            useLegacyPackaging = providers.gradleProperty('compressNativeLibraries').orElse('true').get().toBoolean()
        }
    }

    buildTypes
    {
        release
        {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions
    {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// finds Python 3 and rejects the Windows store placeholder
def resolvePython()
{
    def candidates = ['python', 'py', 'python3']

    for (candidate in candidates)
    {
        try
        {
            def probe = [candidate, '--version'].execute()
            def output = probe.inputStream.text + probe.errorStream.text
            probe.waitFor()

            if (probe.exitValue() == 0 && output.contains('Python 3'))
            {
                return candidate
            }
        }
        catch (Exception notFound)
        {
        }
    }

    throw new GradleException("no python 3 found on PATH (tried: " + candidates.join(', ') + ")")
}

tasks.register('prepareNodeRuntime', Exec)
{
    def arguments = [pythonExe, nodeRuntimeFetcher.absolutePath, '--output-dir', nodeRuntimeDirectory.absolutePath, '--abis', androidAbis.join(',')]
    def archive = providers.gradleProperty('nodeRuntimeArchive').orNull
    if (archive != null)
    {
        arguments.addAll(['--archive', rootProject.file(archive).absolutePath])
    }
    commandLine arguments
    inputs.file nodeRuntimeFetcher
    inputs.file new File(nodeRuntimeFetcher.parentFile, 'nodejs-mobile-runtime.json')
    inputs.dir new File(nodeRuntimeFetcher.parentFile, 'licenses')
    inputs.property 'nodeRuntimeVersion', nodeRuntimeMetadata.version
    inputs.property 'androidAbis', androidAbis.join(',')
    // no outputs declaration so Gradle cannot create the immutable directory
}

tasks.register('copyNodeNotices', Sync)
{
    dependsOn tasks.named('prepareNodeRuntime')
    from new File(nodeRuntimeDirectory, 'notices')
    into layout.buildDirectory.dir('generated/node-notices/third-party')
}
android.sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/node-notices')

tasks.configureEach
{
    if (name.startsWith('configureCMake') || name.startsWith('buildCMake') || name.startsWith('externalNativeBuild'))
    {
        dependsOn tasks.named('prepareNodeRuntime')
    }
}

// minification is selected with clientBuildMode and never prompts
def clientBuildMode = providers.gradleProperty('clientBuildMode').orElse('unminified').get()
if (!(clientBuildMode in ['minified', 'unminified']))
{
    throw new GradleException('clientBuildMode must be minified or unminified')
}
def browserClientDirectory = rootProject.file('../../browser')
def nodeClientDirectory = rootProject.file('../nodejs-client')
tasks.register('prepareNodeRuntimeProbeAssets', Sync)
{
    from(browserClientDirectory)
    {
        include 'main/scripts/vendor/aes-js.js', 'main/scripts/vendor/sha256.js', 'main/scripts/vendor/js-sha256.js'
        include 'main/scripts/app/crypto/rsa-crypto.js', 'main/scripts/app/crypto/identity-file.js', 'main/scripts/app/crypto/keys.js'
        include 'main/scripts/app/workers/workers.js', 'main/wasm/rsa_keygen.wasm'
        include 'client-webassemblies/rsa-keygen/test/vectors-2048.json'
        into 'browser'
    }
    from rootProject.file('test/runtime-probe.cjs')
    from rootProject.file('test/node18-identity-vectors.json')
    from new File(nodeClientDirectory, 'nodejs-mobile-runtime.json')
    into layout.buildDirectory.dir('generated/node-runtime-probe/probe')
}
android.sourceSets.androidTest.assets.srcDir layout.buildDirectory.dir('generated/node-runtime-probe')
tasks.configureEach
{
    if ((name.startsWith('merge') && name.endsWith('AndroidTestAssets')) || (name.contains('AndroidTest') && name.toLowerCase().contains('lint')))
    {
        dependsOn tasks.named('prepareNodeRuntimeProbeAssets')
    }
}
def nodeInputProcess = [pythonExe, new File(nodeClientDirectory, 'build-node.py').absolutePath, '--list-inputs'].execute()
def nodeInputPaths = nodeInputProcess.inputStream.getText('UTF-8').readLines()
def nodeInputErrors = nodeInputProcess.errorStream.getText('UTF-8')
nodeInputProcess.waitFor()
if (nodeInputProcess.exitValue() != 0)
{
    throw new GradleException('Cannot enumerate Node build inputs: ' + nodeInputErrors)
}
def nodeBuildInputs = files(nodeInputPaths)
def nodeBundleFile = new File(nodeClientDirectory, 'bundle.js')
def nodeFingerprintFile = layout.buildDirectory.file('generated/nodejs/bundle-fingerprint.json').get().asFile

def sha256File(File sourceFile)
{
    return java.security.MessageDigest.getInstance('SHA-256').digest(sourceFile.bytes).encodeHex().toString()
}

def nodeInputSnapshot =
{
    def snapshot = new TreeMap()
    for (File sourceFile : nodeBuildInputs.files)
    {
        snapshot[sourceFile.canonicalPath] = sha256File(sourceFile)
    }
    return snapshot
}

// builds the browser page and shared Node bundle before packaging
task buildClientHtml(type: Exec)
{
    workingDir browserClientDirectory
    commandLine 'node', 'build.cjs', '--' + clientBuildMode, '--no-server-copy'
    inputs.property 'clientBuildMode', clientBuildMode
    inputs.dir new File(browserClientDirectory, 'main')
    inputs.file new File(browserClientDirectory, 'build.cjs')
    outputs.file "${rootDir}/../../../client.html"
}

task buildNodeBundle(type: Exec)
{
    workingDir "${rootDir}/../nodejs-client"
    commandLine pythonExe, 'build-node.py'
    inputs.files nodeBuildInputs
    outputs.file nodeBundleFile
    outputs.file nodeFingerprintFile
    mustRunAfter buildClientHtml

    doLast
    {
        nodeFingerprintFile.parentFile.mkdirs()
        nodeFingerprintFile.setText(groovy.json.JsonOutput.toJson(
            [inputs: nodeInputSnapshot(), bundle: sha256File(nodeBundleFile)]), 'UTF-8')
    }
}

task copyExternalHtml(type: Copy)
{
    dependsOn buildClientHtml
    from "${rootDir}/../../../client.html"
    into "${projectDir}/src/main/assets"
}

// identical Wasm bytes remain valid after a timestamp change
task checkNodeBundleFresh
{
    dependsOn buildNodeBundle

    doLast
    {
        if (!nodeBundleFile.exists() || !nodeFingerprintFile.exists())
        {
            throw new GradleException('Node bundle or its build fingerprint is missing')
        }
        def fingerprint = new groovy.json.JsonSlurper().parse(nodeFingerprintFile, 'UTF-8')
        if (fingerprint.inputs != nodeInputSnapshot() || fingerprint.bundle != sha256File(nodeBundleFile))
        {
            throw new GradleException(
                'Node bundle contents or inputs changed after generation; rebuild before packaging')
        }
    }
}

task copyNodeProject(type: Sync)
{
    dependsOn buildNodeBundle
    dependsOn checkNodeBundleFresh

    from("${rootDir}/../nodejs-client")
    {
        include 'bundle.js'
        include 'load-bundle.js'
        include 'android-main.js'
        include 'android-bridge-client.js'
        include 'loopback-ui-server.js'
        include 'websocket-adapter.js'
        include 'transport-limits.js'
        include 'loopback-transfer.js'
        include 'vendor/ws/**'
        include 'vendor/ws-lock.json'
    }
    into "${projectDir}/src/main/assets/nodejs-project"
}

preBuild.dependsOn copyExternalHtml
preBuild.dependsOn copyNodeProject
preBuild.dependsOn tasks.named('prepareNodeRuntime')
preBuild.dependsOn tasks.named('copyNodeNotices')

