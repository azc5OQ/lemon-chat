# uncomment this if you want to debug stunnel in case it doesnt work, has tobe places on top, yes
# foreground = no
# output = /var/log/stunnel/stunnel.log
# debug = 5
# pid = /var/run/stunnel.pid



[chatserver]
accept = 0.0.0.0:1112
connect = 127.0.0.1:1111
cert = /etc/letsencrypt/live/DOMAINNAME.com/fullchain.pem
#in cert use fullchain.pem instead of cert.pem (can cause problems)
key =  /etc/letsencrypt/live/DOMAINNAME.com/privkey.pem

#patchedstunnel specific setting
#this patched build injects the client IP as an "X-Stunnel-Client-IP" header (not the standard X-Forwarded-For) and strips any client-supplied copy; the chat server only trusts that header from 127.0.0.1
xforwardedfor=yes

#stunnel gets installed using make script into /usr/local/bin
#run like so
#/usr/local/bin/stunnel /usr/local/bin/stunnel.conf
